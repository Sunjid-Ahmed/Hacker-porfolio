    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: url(cityscape-anime-inspired-urban-area.jpg) no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }
        .header {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            padding: 20px 0;
            font-size: 28px;
            font-weight: bold;
        }
        nav {
            display: flex;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            margin: 0 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        nav a:hover, .active {
            background: #ff4444;
            border-radius: 5px;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
            text-align: center;
        }
        .contact-box {
            background: rgba(0, 0, 0, 0.9);
            padding: 25px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            max-width: 600px;
        }
        .contact-box h2 {
            color: #ff4444;
            margin-bottom: 10px;
        }
        .contact-box p {
            font-size: 18px;
            color: #ccc;
            margin: 5px 0;
        }
        .contact-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .contact-buttons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }
        .contact-buttons a img {
            width: 30px;
            height: 30px;
        }
        .whatsapp {
            background: #25D366;
        }
        .whatsapp:hover {
            background: #1ebc59;
        }
        .email {
            background: #ff4444;
        }
        .email:hover {
            background: #cc0000;
        }
        .messenger {
            background: #0084FF;
        }
        .messenger:hover {
            background: #006cd1;
        }
        .telegram {
            background: #0088CC;
        }
        .telegram:hover {
            background: #0077b5;
        }
        .phone {
            background: #34b7f1;
        }
        .phone:hover {
            background: #1a99d6;
        }
