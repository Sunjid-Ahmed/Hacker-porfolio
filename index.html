        .menu-container {
            position: absolute;
            top: 15px;
            left: 15px;
            cursor: pointer;
            font-size: 24px;
            z-index: 1000;
            background: #007bff;
            color: white;
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            transition: background 0.3s;
        }
        .menu-container:hover {
            background: #0056b3;
        }
        .menu-content {
            display: none;
            position: absolute;
            top: 50px;
            left: 0;
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            min-width: 180px;
        }
        .menu-content a {
            display: block;
            padding: 12px 16px;
            text-decoration: none;
            color: black;
            font-size: 16px;
            transition: background 0.3s;
        }
        .menu-content a:hover {
            background: #007bff;
            color: white;
        }
        .menu-container:focus-within .menu-content,
        .menu-container:hover .menu-content {
            display: block;
        }
    </style>
