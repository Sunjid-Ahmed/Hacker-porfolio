<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="images/jpg" href="images/favicon.jpg">
    <title> Sunjid's Portfolio</title>
    <title>Skills</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: url(anime-style-mythical-dragon-creature.jpg) no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }
        .header {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            padding: 20px 0;
            font-size: 28px;
            font-weight: bold;
        }
        nav {
            display: flex;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            margin: 0 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        nav a:hover, .active {
            background: #ff4444;
            border-radius: 5px;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        .skill {
            background: rgba(0, 0, 0, 0.9);
            padding: 25px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            text-align: center;
            position: relative;
        }
        .skill h2 {
            color: #ff4444;
            margin-bottom: 10px;
        }
        .progress-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .progress-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(#222 0%, #222 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 18px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            position: relative;
        }
        .progress-circle::before {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background: #000;
            border-radius: 50%;
            z-index: 1;
        }
        .progress-text {
            position: absolute;
            z-index: 2;
        }
        @keyframes fillAnimation {
            from {
                background: conic-gradient(#222 0%, #222 100%);
            }
            to {
                background: conic-gradient(#ff4444 var(--percentage), #222 var(--percentage));
            }
        }
        .progress-circle.animated {
            animation: fillAnimation 2s ease-in-out forwards;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll(".progress-circle").forEach(circle => {
                setTimeout(() => {
                    circle.classList.add("animated");
                }, 500);
            });
        });
    </script>
</head>
<body>
    <div class="header">My Skills</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="skills.html" class="active">Skills</a>
        <a href="education.html">Education</a>
        <a href="experience.html">Experience</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div class="container">
        <div class="skill">
            <h2>Android App Development</h2>
            <div class="progress-container">
                <div class="progress-circle" style="--percentage: 90%;">
                    <span class="progress-text">90%</span>
                </div>
            </div>
        </div>
        <div class="skill">
            <h2>Graphic Design</h2>
            <div class="progress-container">
                <div class="progress-circle" style="--percentage: 75%;">
                    <span class="progress-text">75%</span>
                </div>
            </div>
        </div>
        <div class="skill">
            <h2>Cyber Security</h2>
            <div class="progress-container">
                <div class="progress-circle" style="--percentage: 85%;">
                    <span class="progress-text">85%</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
